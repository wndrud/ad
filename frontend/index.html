    <!-- Complete Mobile Viewport Pinch-to-Zoom Blocker for iOS Safari & Android Chrome -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        
        function blockPinch(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }

        function blockGesture(e) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        // Intercept ONLY multi-touch (2+ fingers) at CAPTURING phase so single finger taps/clicks work 100%
        ['touchstart', 'touchmove'].forEach(function(evt) {
          document.addEventListener(evt, blockPinch, { passive: false, capture: true });
          window.addEventListener(evt, blockPinch, { passive: false, capture: true });
          if (document.documentElement) {
            document.documentElement.addEventListener(evt, blockPinch, { passive: false, capture: true });
          }
        });

        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(evt) {
          document.addEventListener(evt, blockGesture, { passive: false, capture: true });
          window.addEventListener(evt, blockGesture, { passive: false, capture: true });
          if (document.documentElement) {
            document.documentElement.addEventListener(evt, blockGesture, { passive: false, capture: true });
          }
        });

        // Block desktop trackpad ctrl+wheel pinch zoom
        window.addEventListener('wheel', function(e) {
          if (e.ctrlKey) {
            e.preventDefault();
          }
        }, { passive: false });
      })();
    </script>
